<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>🇧🇭 كاشف الحركة البحريني 🇧🇭</title>

    <style>
        body {
            background: linear-gradient(135deg, #ffffff 0%, #f7e9e9 100%);
            font-family: "Cairo", sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #7a0000;
        }

        /* ===== العنوان ===== */
        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            color: #b30000;
            margin-top: 10px;
            text-shadow: 0px 0px 10px rgba(255, 0, 0, 0.25);
            letter-spacing: 1px;
            animation: fadeInDown 1s ease-in-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== إطار الكاميرا البحريني ===== */
        #videoBox {
            width: 85%;
            max-width: 680px;
            height: 450px;
            margin: 25px auto;
            border-radius: 18px;
            padding: 10px;
            background: linear-gradient(135deg, #b30000, #ffcccc);
            border: 6px solid #ffc700; /* ذهبي */
            box-shadow: 0 0 20px rgba(179, 0, 0, 0.4);
            position: relative;
        }

        /* موجات العلم البحريني */
        #videoBox::before {
            content: "";
            position: absolute;
            left: -20px;
            top: 0;
            width: 25px;
            height: 100%;
            background: repeating-linear-gradient(
                180deg,
                #ffffff 0px,
                #ffffff 26px,
                #b30000 26px,
                #b30000 52px
            );
            clip-path: polygon(0 0, 100% 10%, 0 20%, 100% 30%, 0 40%, 
                               100% 50%, 0 60%, 100% 70%, 0 80%, 100% 90%, 0 100%);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            transform: scaleX(-1);
        }

        /* ===== خانة الحالة ===== */
        #status {
            display: inline-block;
            padding: 12px 25px;
            background: #b30000;
            color: #fff;
            font-size: 1.3rem;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(179, 0, 0, 0.35);
            margin-top: 10px;
            transition: 0.3s;
            font-weight: bold;
        }

        /* أيقونة العلم */
        .flag {
            width: 26px;
            vertical-align: middle;
            margin-left: 6px;
        }
    </style>
</head>

<body>

    <h1>🇧🇭 كــــاشــــف الـــحــــركــــة الـــبــــحــــريــــنــــي 🇧🇭</h1>

    <div id="videoBox">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="status">📷 يتم تشغيل الكاميرا الآن…</div>

    <audio id="welcomeSound" src="welcome_sound.mp3" preload="auto"></audio>

    <script>
        const video = document.getElementById("video");
        const statusLabel = document.getElementById("status");
        const sound = document.getElementById("welcomeSound");

        let lastFrame = null;
        let cooldown = false;
        const COOLDOWN_TIME = 5000;

        /* ---------------- تشغيل الكاميرا ---------------- */
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                statusLabel.textContent = "✔ الكاميرا تعمل — بانتظار حركة 🇧🇭";
            })
            .catch(err => {
                statusLabel.textContent = "❌ فشل تشغيل الكاميرا: " + err;
            });

        /* ---------------- كاشف الحركة ---------------- */
        function detectMotion() {
            if (video.readyState < 2) {
                requestAnimationFrame(detectMotion);
                return;
            }

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0);
            const current = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (lastFrame) {
                let diff = 0;

                for (let i = 0; i < current.data.length; i += 4) {
                    const d =
                        Math.abs(current.data[i] - lastFrame.data[i]) +
                        Math.abs(current.data[i + 1] - lastFrame.data[i + 1]) +
                        Math.abs(current.data[i + 2] - lastFrame.data[i + 2]);

                    if (d > 60) diff++;
                }

                if (diff > 50000 && !cooldown) {
                    triggerMotionEvent();
                }
            }

            lastFrame = current;
            requestAnimationFrame(detectMotion);
        }

        /* ---------------- حدث الحركة ---------------- */
        function triggerMotionEvent() {
            cooldown = true;
            statusLabel.style.background = "#7a0000";
            statusLabel.innerHTML = "🚨 تم اكتشاف حركة — هلا ومرحبا بكم 🇧🇭";

            sound.play().catch(() => {
                statusLabel.textContent = "❌ المتصفح منع الصوت — اضغطي مرة على الشاشة.";
            });

            setTimeout(() => {
                statusLabel.style.background = "#b30000";
                statusLabel.textContent = "✔ الكاشف جاهز — بانتظار حركة جديدة 🇧🇭";
                cooldown = false;
            }, COOLDOWN_TIME);
        }

        requestAnimationFrame(detectMotion);
    </script>

</body>
</html>
